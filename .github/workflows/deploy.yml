# REDESIGN path: rebuilds and deploys the app only when app code changes on main.
# Data is never touched here (the sync workflow owns data/).
name: Deploy app

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same branch queue as the sync job; job-level so a waiting Pages deploy never blocks it.
    concurrency:
      group: gh-pages-branch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: bash scripts/publish-pages.sh app
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: deploy
    uses: ./.github/workflows/pages.yml
