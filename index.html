    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var t = localStorage.getItem('kp7.theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
            var c = t === 'dark' ? '#0a0b0c' : '#f3f2ee';
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); });
          }
        } catch (e) {}
      })();
    </script>
    <style>
      html { background: #f3f2ee; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0a0b0c; } }
      html[data-theme='dark'] { background: #0a0b0c; }
